services:
  stock-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # ── Required ──────────────────────────────────────────────────────────
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # ── Optional ──────────────────────────────────────────────────────────
      - WATCHLIST_SYMBOLS=${WATCHLIST_SYMBOLS:-AAPL,MSFT,GOOGL,NVDA,AMZN,META,BTC-USD,ETH-USD,SOL-USD}
      - TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY:-}
      - ALPHA_VANTAGE_KEY=${ALPHA_VANTAGE_KEY:-}
    volumes:
      - stock-analyzer-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/indices"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  stock-analyzer-data:
